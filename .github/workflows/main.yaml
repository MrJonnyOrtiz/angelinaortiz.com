# ============================================================
# DISABLED — legacy CRA auto-deploy.
#
# This workflow used to rebuild the old Create-React-App site and
# `s3 sync --delete` it to s3://angelinaortiz.com on every push to master.
#
# The live site is now the static performer-template, deployed via
# performer-template/deploy-live.sh. If this workflow ran on push it would
# REBUILD THE OLD APP AND OVERWRITE THE NEW SITE — so its automatic trigger
# has been removed. It can now only be run manually (workflow_dispatch), and
# only if you intentionally want to restore the old CRA app.
#
# To fully retire it, delete this file.
# ============================================================
name: CI/CD (legacy CRA — DISABLED, manual only)

on:
   workflow_dispatch: {}

jobs:
   build:
      runs-on: ubuntu-latest
      env:
         BUCKET_NAME: angelinaortiz.com

      name: process files
      steps:
         - uses: actions/checkout@v3

         - name: Installing Node.js
           uses: actions/setup-node@v3
           with:
              node-version: "16"

         - name: Installing dependencies
           run: npm install

         - name: Building project
           run: npm run build

         - name: Configure AWS CLI on runner
           uses: aws-actions/configure-aws-credentials@v1
           with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: us-east-1

         - name: Deploy to S3 bucket
           run: aws s3 sync build/ s3://${{ env.BUCKET_NAME }} --delete

         - name: Create CloudFront invalidations
           run: aws cloudfront create-invalidation --distribution-id E2NT79X8JGU0TX --paths "/*"
